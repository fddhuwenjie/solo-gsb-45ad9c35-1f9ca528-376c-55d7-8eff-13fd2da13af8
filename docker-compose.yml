services:
  astro-planner:
    build: .
    image: astro-observation-planner:latest
    container_name: astro-observation-planner
    ports:
      - "8000:8000"
    volumes:
      - planner-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  planner-data:
